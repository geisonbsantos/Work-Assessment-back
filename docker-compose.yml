services:
    # ============================================================
    # Laravel + PHP-FPM + Node.js
    # ============================================================
    app:
        build:
            args:
                user: user-docker
                uid: 1000
            context: ./
            dockerfile: Dockerfile

        image: work-assessment-back-app
        container_name: work-assessment-back-api
        restart: unless-stopped

        working_dir: /var/www/

        user: "1000:1000"

        environment:
            XDEBUG_MODE: debug
            XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 idekey=docker

            # Permite que o Vite seja acessado pelo host
            HOST: 0.0.0.0

        volumes:
            - ./:/var/www
            - ./docker/php/php-local.ini:/usr/local/etc/php/conf.d/php-local.ini
            - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

        networks:
            - work-assessment-back

        extra_hosts:
            - "host.docker.internal:host-gateway"

    # ============================================================
    # Nginx
    # ============================================================
    nginx:
        image: nginx:alpine
        container_name: work-assessment-back-nginx
        restart: unless-stopped

        ports:
            - "9080:80"

        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

        networks:
            - work-assessment-back

    # ============================================================
    # Vite / Node.js
    #
    # O Node está dentro do container app.
    # Este serviço apenas executa o Vite usando a mesma imagem.
    # ============================================================
    vite:
        image: work-assessment-back-app
        container_name: work-assessment-back-vite

        working_dir: /var/www

        user: "1000:1000"

        command: npm run dev -- --host 0.0.0.0

        volumes:
            - ./:/var/www

        ports:
            - "5173:5173"

        depends_on:
            - app

        networks:
            - work-assessment-back

        extra_hosts:
            - "host.docker.internal:host-gateway"


# ============================================================
# Rede
# ============================================================
networks:
    work-assessment-back:
        driver: bridge